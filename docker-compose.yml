services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_PASSWORD: local-postgres
    ports:
      - "54329:5432"
    volumes:
      - siftcut-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-siftcut.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  siftcut-postgres:
