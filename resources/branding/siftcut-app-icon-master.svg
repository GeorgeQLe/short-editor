<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title description">
  <title id="title">SiftCut app icon</title>
  <desc id="description">A vertical violet and orange film frame divided by a diagonal cut on a deep-indigo squircle.</desc>

  <defs>
    <linearGradient id="tile" x1="176" y1="128" x2="848" y2="896" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24205F"/>
      <stop offset="1" stop-color="#15123F"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="88" y="88" width="848" height="848" rx="196"/>
    </clipPath>
  </defs>

  <!-- Transparent canvas outside this single macOS-style tile. -->
  <rect x="88" y="88" width="848" height="848" rx="196" fill="url(#tile)"/>

  <!-- Rotate the film mark clockwise: violet reads as the top clip, orange as the bottom. -->
  <g transform="rotate(90 512 512)">
    <!-- One film frame, separated into two pieces by a 24px diagonal cut. -->
    <path d="M258 344
             H542
             L470 680
             H258
             Q218 680 218 640
             V384
             Q218 344 258 344Z"
          fill="#8658F5"/>
    <path d="M566 344
             H766
             Q806 344 806 384
             V640
             Q806 680 766 680
             H494Z"
          fill="#F39A3F"/>

    <!-- Four large film perforations remain legible at small icon sizes. -->
    <rect x="272" y="382" width="104" height="58" rx="18" fill="#1B174B"/>
    <rect x="648" y="382" width="104" height="58" rx="18" fill="#1B174B"/>
    <rect x="272" y="584" width="104" height="58" rx="18" fill="#1B174B"/>
    <rect x="648" y="584" width="104" height="58" rx="18" fill="#1B174B"/>
  </g>

  <!-- Restrained top-edge highlight, clipped to the one background tile. -->
  <path d="M236 120 H788 Q904 120 904 236"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".10"
        stroke-width="14"
        stroke-linecap="round"
        clip-path="url(#tile-clip)"/>
</svg>
