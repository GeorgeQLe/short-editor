version: 1
bundle: short-editor/siftcut-staging/staging

policies:
  token-48:
    type: password
    length: 48
    lowercase: true
    uppercase: true
    digits: true
    symbols: true

records:
  CLERK_SECRET_KEY:
    source: import
    sensitivity: secret
  CLERK_WEBHOOK_SIGNING_SECRET:
    source: import
    sensitivity: secret
  STRIPE_SECRET_KEY:
    source: import
    sensitivity: secret
  STRIPE_WEBHOOK_SIGNING_SECRET:
    source: import
    sensitivity: secret
  MEDIA_TOKEN_SIGNING_SECRET:
    source: generate
    policy: token-48
  INTERNAL_WORKER_TOKEN:
    source: generate
    policy: token-48
  TURNSTILE_SECRET_KEY:
    source: import
    sensitivity: secret

targets:
  cloudflare:
    project: siftcut-staging
    environment: staging
    services:
      siftcut-staging:
        order: 1
        variables:
          CLERK_SECRET_KEY: {source: record, record: CLERK_SECRET_KEY}
          CLERK_WEBHOOK_SIGNING_SECRET: {source: record, record: CLERK_WEBHOOK_SIGNING_SECRET}
          STRIPE_SECRET_KEY: {source: record, record: STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SIGNING_SECRET: {source: record, record: STRIPE_WEBHOOK_SIGNING_SECRET}
          MEDIA_TOKEN_SIGNING_SECRET: {source: record, record: MEDIA_TOKEN_SIGNING_SECRET}
          INTERNAL_WORKER_TOKEN: {source: record, record: INTERNAL_WORKER_TOKEN}
          TURNSTILE_SECRET_KEY: {source: record, record: TURNSTILE_SECRET_KEY}
